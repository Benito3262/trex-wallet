name: TREX Wallet Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "App.tsx"
      - "app.json"
      - "package.json"
      - "tsconfig.json"
      - "src/**"
      - "assets/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-standalone-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Public Reown (WalletConnect) project ID; it is bundled into the app and is not a secret.
      # A repository variable with the same name overrides it.
      EXPO_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ vars.EXPO_PUBLIC_WALLETCONNECT_PROJECT_ID || 'd0f69a58b067c07eeb5bba4030fc9bf9' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare brand assets
        run: |
          # Older revisions generated PNGs from assets/icon.svg; current ones commit the official logo PNGs.
          if [ -f assets/icon.svg ] && [ ! -f assets/icon.png ]; then
            sudo apt-get update && sudo apt-get install -y imagemagick
            convert -background none assets/icon.svg -resize 1024x1024 assets/icon.png
            convert -background none assets/icon.svg -resize 1024x1024 -gravity center -extent 1024x1024 assets/adaptive-icon.png
          fi
          test -s assets/icon.png && test -s assets/adaptive-icon.png
      - name: Install JavaScript dependencies
        run: npm install
      - name: Validate dependencies
        run: npx expo install --check
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --runInBand
      - name: Validate Expo configuration
        run: npx expo config --type public
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --non-interactive
      - name: Build standalone release APK with embedded JS bundle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify APK contains packaged JavaScript bundle
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -E 'assets/index.android.bundle|assets/.*\.bundle'
      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: trex-wallet-standalone-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
