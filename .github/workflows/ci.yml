name: TREX Wallet CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check Expo dependency compatibility
        run: npx expo install --check
      - name: Generate launcher icon assets
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          mkdir -p assets
          convert -background none assets/icon.svg -resize 1024x1024 assets/icon.png
          convert -background none assets/icon.svg -resize 1024x1024 -gravity center -extent 1024x1024 assets/adaptive-icon.png
      - name: Expo Doctor
        run: npx expo-doctor
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --runInBand
